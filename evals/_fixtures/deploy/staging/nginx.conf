# Staging: nginx routes the same two paths the production load balancer does
events {}
http {
  server {
    listen 443 ssl;
    server_name staging.shop.example.com;
    ssl_certificate /etc/nginx/certs/staging.pem;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    location /api/orders/       { proxy_pass http://orders:8080; }
    location /webhooks/stripe/  { proxy_pass http://payments:8080; }
  }
}

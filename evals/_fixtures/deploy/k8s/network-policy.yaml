# Production: only the load balancer may reach Payments; Payments may reach only the database and HTTPS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: payments-lockdown, namespace: payments}
spec:
  podSelector: {matchLabels: {app: payments}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ipBlock: {cidr: 10.20.0.0/16}}]   # the VPC subnets the load balancer sits in
      ports: [{port: 8080}]
  egress:
    - to: [{ipBlock: {cidr: 10.20.64.0/20}}]   # RDS subnets
      ports: [{port: 5432}]
    - ports: [{port: 443}]                      # Stripe API and SQS
    - ports: [{port: 53, protocol: UDP}]        # DNS

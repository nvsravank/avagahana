{
  "schema_version": "1.1",
  "name": "er-billing",
  "tags": [
    "pick",
    "evidence"
  ],
  "runs": 1,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "What is the table structure in the billing folder, and how do the tables relate to each other? Save what you create in output/.",
    "max_turns": 40,
    "timeout_seconds": 900,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit",
      "Bash"
    ]
  },
  "graders": [
    {
      "name": "skill",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?illuminate-concept\""
    },
    {
      "name": "no-html",
      "type": "file_exists",
      "path": "**/*.html",
      "exists": false
    },
    {
      "name": "wrote-md",
      "type": "file_exists",
      "path": "output/**/*.md"
    },
    {
      "name": "picture",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?erDiagram"
    },
    {
      "name": "keys",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?\\bPK\\b[^\\n]*\\bFK\\b"
    },
    {
      "name": "column-relations",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?## Relations[^\\n]*\\.customer_id[^\\\\]*\\.id\\b",
      "flags": "i"
    },
    {
      "name": "reason",
      "type": "llm",
      "focus": "trace",
      "criteria": "PASS if the agent read billing/schema.sql, inferred the model from the CREATE TABLE statements, and made an Avagahana map (a Markdown file with a mermaid erDiagram) under output/ with all five tables, their keys, and the tables joined column to column in ## Relations with the right cardinalities (one customer to many invoices; one invoice to many lines and many payments; one product to many lines). FAIL if it made no such map, or relations or cardinalities are missing or wrong."
    }
  ]
}

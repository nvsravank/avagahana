{
  "schema_version": "1.1",
  "name": "c4-alone",
  "tags": [
    "pick",
    "conflict"
  ],
  "runs": 1,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "Draw a C4 container diagram of the shop project. Save what you create in output/.",
    "max_turns": 50,
    "timeout_seconds": 900,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit",
      "Bash"
    ]
  },
  "graders": [
    {
      "name": "skill",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?illuminate-concept\""
    },
    {
      "name": "no-html",
      "type": "file_exists",
      "path": "**/*.html",
      "exists": false
    },
    {
      "name": "wrote-md",
      "type": "file_exists",
      "path": "output/**/*.md"
    },
    {
      "name": "picture",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?```mermaid"
    },
    {
      "name": "reason",
      "type": "llm",
      "focus": "trace",
      "criteria": "PASS if the agent read the shop repository and made an Avagahana map (a Markdown file with a mermaid block) under output/ showing the shop's containers (Orders, Payments, the database) and how they connect. FAIL if it answered only in text, or wrote its own HTML or SVG page instead of a map."
    }
  ]
}

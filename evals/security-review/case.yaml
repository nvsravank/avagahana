{
  "schema_version": "1.1",
  "name": "security-review",
  "tags": [
    "route"
  ],
  "runs": 1,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "Do a security review of the project in the shop folder. Save what you create in output/.",
    "max_turns": 60,
    "timeout_seconds": 1200,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit",
      "Bash"
    ]
  },
  "graders": [
    {
      "name": "skill",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?trace-architecture\""
    },
    {
      "name": "no-html",
      "type": "file_exists",
      "path": "**/*.html",
      "exists": false
    },
    {
      "name": "wrote-md",
      "type": "file_exists",
      "path": "output/**/*.md"
    },
    {
      "name": "walkthrough",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?## Walkthrough: Security review"
    },
    {
      "name": "asks-scope",
      "type": "regex",
      "pattern": "release",
      "flags": "i"
    },
    {
      "name": "reply",
      "type": "llm",
      "focus": "last_message",
      "criteria": "PASS if the reply asks or states whether the review is for a release or for the project as it is now, summarises the main security points (the card provider boundary, secrets, missing checks) and points to a map with a Security review walkthrough under output/. FAIL if it is a text-only review."
    }
  ]
}

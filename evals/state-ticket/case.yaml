{
  "schema_version": "1.1",
  "name": "state-ticket",
  "tags": [
    "pick"
  ],
  "runs": 1,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "Show me the states a support ticket goes through: new, triaged, waiting on customer, resolved, reopened, closed. Save what you create in output/.",
    "max_turns": 30,
    "timeout_seconds": 600,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit",
      "Bash"
    ]
  },
  "graders": [
    {
      "name": "skill",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?illuminate-concept\""
    },
    {
      "name": "no-html",
      "type": "file_exists",
      "path": "**/*.html",
      "exists": false
    },
    {
      "name": "wrote-md",
      "type": "file_exists",
      "path": "output/**/*.md"
    },
    {
      "name": "picture",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?stateDiagram-v2"
    },
    {
      "name": "reason",
      "type": "llm",
      "criteria": "PASS if the agent made an Avagahana map (a Markdown file with a mermaid block, checked by its checker) written under output/ with a state diagram of the ticket, because one thing changes over its life. FAIL otherwise.",
      "focus": "trace"
    }
  ]
}

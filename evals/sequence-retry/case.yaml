{
  "schema_version": "1.1",
  "name": "sequence-retry",
  "tags": [
    "pick"
  ],
  "runs": 1,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "How does the worker in the jobs folder recover when the queue is down? Save what you create in output/.",
    "max_turns": 30,
    "timeout_seconds": 600,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit",
      "Bash"
    ]
  },
  "graders": [
    {
      "name": "skill",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?illuminate-concept\""
    },
    {
      "name": "no-html",
      "type": "file_exists",
      "path": "**/*.html",
      "exists": false
    },
    {
      "name": "wrote-md",
      "type": "file_exists",
      "path": "output/**/*.md"
    },
    {
      "name": "picture",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?sequenceDiagram"
    },
    {
      "name": "loop",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?\\bloop\\b"
    },
    {
      "name": "evidence",
      "type": "regex",
      "target": "trace",
      "pattern": "/output/[^\"\\s\\\\]*\\.md[^\\n]*?#### Evidence[^\\n]*worker\\.py"
    },
    {
      "name": "reason",
      "type": "llm",
      "focus": "trace",
      "criteria": "PASS if the agent read jobs/worker.py and made an Avagahana map (a Markdown file with a mermaid block) under output/ with a sequence diagram of the recovery: the connect retries with 5, 30 and 120 second waits, the on-call alert after the third failure, and the message put back on the queue (nack, requeue) when sending fails, with evidence citing worker.py lines; and its reply explains it. FAIL if it made no such map or misreads the code."
    }
  ]
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map viewer: performance</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  #report { padding: 8px 12px; border-bottom: 1px solid #ddd; }
  #report table { border-collapse: collapse; }
  #report td, #report th { padding: 2px 10px; text-align: right; }
  #report th:first-child, #report td:first-child { text-align: left; }
  .fail { color: #c92a2a; font-weight: 600; }
  #stage { min-height: 0; }
</style>
</head>
<body>
<div id="report">Running…</div>
<div id="stage"></div>
<script type="module">
  // Budget (WO-02): 1,000 nodes parse + layout + first paint under 150 ms;
  // 5,000 usable; theme / appearance / colour-by switches repaint nothing.
  import { mount } from '../index.js';

  const WORDS = 'alpha beta gamma delta river stone field cloud signal bridge harbour lantern meadow orbit pixel quarry ridge summit timber valley'.split(' ');
  function bigMap(total, salt) {
    // a centre, 8 main branches, then breadth-first children (5 each) until `total`
    const lines = ['# Generated', '', '```mermaid', 'mindmap', '  n1(("Centre"))'];
    const queue = [{ id: 1, depth: 0 }];
    let next = 2;
    const children = new Map();
    while (next <= total && queue.length) {
      const p = queue.shift();
      const k = p.depth === 0 ? 8 : 5;
      for (let i = 0; i < k && next <= total; i++) {
        const c = { id: next++, depth: p.depth + 1 };
        (children.get(p.id) || children.set(p.id, []).get(p.id)).push(c);
        queue.push(c);
      }
    }
    // salted per run, so no label width is already cached: every load is cold
    const label = (id) => `${WORDS[id % WORDS.length]}${salt} ${WORDS[(id * 7) % WORDS.length]} ${id}`;
    (function emit(id, depth) {
      for (const c of children.get(id) || []) {
        lines.push(`${'  '.repeat(depth + 2)}n${c.id}("${depth === 0 ? `**${label(c.id)}**` : label(c.id)}")`);
        if (c.id % 9 === 0) lines.push(`${'  '.repeat(depth + 2)}::icon(${c.id % 2 ? 'done' : 'ph database'})`);
        emit(c.id, depth + 1);
      }
    })(1, 0);
    lines.push('```', '', '## Relations', '');
    for (let i = 10; i < total; i += 37) lines.push(`- n${i} --> n${Math.max(2, (i * 13) % total)} : link`);
    return lines.join('\n');
  }

  // Force style and layout now, so timings do not depend on frames (a hidden tab
  // throttles requestAnimationFrame to about one per second).
  const settle = (root) => { const n = root.querySelector('.mmv-node'); void root.querySelector('[data-mmv=viewport]').getBoundingClientRect(); if (n) void getComputedStyle(n.querySelector('.mmv-shape') || n).fill; };
  const rows = [];
  const viewer = mount(document.getElementById('stage'), { storageKey: null });
  await viewer.ready;
  const root = document.querySelector('.mmv');
  for (const n of [100, 1000, 5000]) {
    // 5 cold loads: new labels and a new path each time, so nothing is kept
    const times = [];
    for (let run = 0; run < 5; run++) {
      const text = bigMap(n, `${n}r${run}`);
      const t0 = performance.now();
      await viewer.load(text, `gen-${n}-${run}.md`);
      settle(root);
      times.push(performance.now() - t0);
    }
    const firstMs = times[0];   // includes the JavaScript engine warming up
    const loadMs = [...times].sort((x, y) => x - y)[2];
    let t;
    const shownDefault = root.querySelectorAll('.mmv-node').length;
    // open everything: every node laid out and painted
    settle(root);
    // appearance + colour-by + look switch: must not replace any node element
    const first = root.querySelector('.mmv-node');
    t = performance.now();
    root.querySelector('[data-pref=appearance] [data-v=dark]')?.click();
    root.querySelector('[data-pref=colourBy] [data-v=level]')?.click();
    root.querySelector('[data-pref=look] [data-v=outline]')?.click();
    settle(root);
    const switchMs = performance.now() - t;
    const repainted = root.querySelector('.mmv-node') !== first;
    root.querySelector('[data-pref=appearance] [data-v=light]')?.click();
    root.querySelector('[data-pref=colourBy] [data-v=category]')?.click();
    root.querySelector('[data-pref=look] [data-v=fade]')?.click();
    settle(root);
    // a pan frame: transform only
    const vp = root.querySelector('[data-mmv=viewport]');
    t = performance.now();
    vp.setAttribute('transform', vp.getAttribute('transform') + ' translate(1,1)');
    settle(root);
    const panMs = performance.now() - t;
    rows.push({ n, firstMs, loadMs, shownDefault, switchMs, repainted, panMs });
  }
  const f = (x) => x.toFixed(1);
  const row = (r) => `<tr><td>${r.n}</td><td class="${r.n === 1000 && r.loadMs > 150 ? 'fail' : ''}">${f(r.firstMs)}</td><td>${f(r.loadMs)}</td><td>${r.shownDefault}</td>`
    
    + `<td class="${r.repainted ? 'fail' : ''}">${f(r.switchMs)}${r.repainted ? ' (repainted!)' : ''}</td><td>${f(r.panMs)}</td></tr>`;
  document.getElementById('report').innerHTML = `<table><tr><th>Nodes</th><th>First open ms</th><th>Open ms (median of 5)</th><th>Drawn</th><th>Theme switch (style) ms</th><th>Pan (style + layout) ms</th></tr>${rows.map(row).join('')}</table>`;
  window.perfResults = rows;
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map viewer: tests</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
  #out { padding: 10px 14px; }
  .pass { color: #2b8a3e; } .fail { color: #c92a2a; font-weight: 600; }
  #stage { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 400px; padding: 6px; }
  #stage > div { min-height: 0; }
</style>
</head>
<body>
<div id="out">Running…</div>
<div id="stage"><div id="a"></div><div id="b"></div></div>
<!-- the checks live in a file, so the page also runs under the relay server's CSP -->
<script type="module" src="contract.js"></script>
</body>
</html>
